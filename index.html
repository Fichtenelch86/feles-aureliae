<script>
// scenes.js – 10 Szenen im Vintage-Storybook-Stil (640x360 logisch, 1280x720 intern)
// Stilmerkmale: kräftige schwarze Outlines, karikaturhafte Figuren mit
// übergroßen Köpfen und Comic-Augen, gesättigte Farben.
// Hotspots und Spiellogik sind gegenüber v2.1 exakt unverändert.

const SCENES = {};

// ---------- Vintage-Storybook-Zeichen-Helfer ----------
// Stil: "Gentle Vintage Storybook Nostalgia" (PromptDeck: vintage-golden-age-storybook)
// Weiche handgetinte Sepia-Linien, zarte Aquarell-Washes, gerundete Formen,
// gedämpfte altmodische Palette. Alle Signaturen identisch zu v3.

// Sepia-Tinte statt hartem Schwarz
const INK = "rgba(84,62,42,0.62)";
const INK_SOFT = "rgba(84,62,42,0.35)";

// Hex-Farb-Helfer: aufhellen/abdunkeln fuer Aquarell-Washes
function shade(hex, amt) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  if (isNaN(n)) return hex;
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt > 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= (1 + amt); g *= (1 + amt); b *= (1 + amt); }
  return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
}

// Abgerundetes Rechteck mit weicher Tinten-Kontur und vertikalem Aquarell-Wash
function rr(ctx, x, y, w, h, col, line, radius) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  const rad = Math.min(radius === undefined ? 2.5 : radius, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
  if (col && typeof col === "object" && col.grad) {
    const gr = ctx.createLinearGradient(0, y, 0, y + h);
    gr.addColorStop(0, col.top); gr.addColorStop(1, col.bot);
    ctx.fillStyle = gr;
  } else {
    const gr = ctx.createLinearGradient(0, y, 0, y + h);
    gr.addColorStop(0, shade(col, 0.14));
    gr.addColorStop(1, shade(col, -0.14));
    ctx.fillStyle = gr;
  }
  ctx.fill();
  if (line !== false) {
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.1;
    ctx.stroke();
  }
}
// Rechteck mit Storybook-Kontur (kompatibel zu allen R(...)-Aufrufen)
function R(ctx, x, y, w, h, col, line) { rr(ctx, x, y, w, h, col, line, 2.5); }
// Flaeche ohne Kontur (fuer Schatten/Texturen)
function RN(ctx, x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
// Ellipse mit Aquarell-Fuellung und weicher Kontur
function ell(ctx, cx, cy, rx, ry, col, line) {
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  const gr = ctx.createLinearGradient(0, cy - ry, 0, cy + ry);
  gr.addColorStop(0, shade(col, 0.16));
  gr.addColorStop(1, shade(col, -0.14));
  ctx.fillStyle = gr;
  ctx.fill();
  if (line !== false) { ctx.strokeStyle = INK; ctx.lineWidth = 1.1; ctx.stroke(); }
}
// Sanfte Stein-Fliesen: gedämpfte Farben, feine Fugen, Licht von oben
function tiles(ctx, x, y, w, h, tw, th, c1, c2) {
  for (let ty = y; ty < y + h; ty += th) {
    for (let tx = x; tx < x + w; tx += tw) {
      const alt = ((tx / tw + ty / th) | 0) % 2 === 0;
      rr(ctx, tx, ty, tw - 2, th - 2, alt ? c1 : c2, false, 1.5);
      RN(ctx, tx + 1, ty + 1, tw - 4, 1.5, "rgba(255,246,228,0.35)");
    }
  }
}
// Himmel: weicher vertikaler Aquarell-Wash statt Streifen
function skyGradient(ctx, top, mid, bot) {
  const gr = ctx.createLinearGradient(0, 0, 0, 360);
  gr.addColorStop(0, top);
  gr.addColorStop(0.55, mid);
  gr.addColorStop(1, bot);
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, 640, 360);
}
// Wolke: weiche Ellipsen-Bloebs mit Rosenstich
function cloud(ctx, x, y, s) {
  s = s || 1;
  ctx.globalAlpha = 0.9;
  ell(ctx, x + 15 * s, y + 8 * s, 15 * s, 8 * s, "#f6f1e6", false);
  ell(ctx, x + 10 * s, y + 4 * s, 9 * s, 7 * s, "#faf6ec", false);
  ell(ctx, x + 22 * s, y + 5 * s, 7 * s, 5 * s, "#f2ecdd", false);
  ctx.globalAlpha = 1;
}
// Storybook-Baum: geschwungener Stamm, weiche Kronen-Blobs
function tree(ctx, x, y, s) {
  s = s || 1;
  // Stamm: geschwungen mit Aquarell-Wash
  ctx.strokeStyle = INK; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x + 10 * s, y + 34 * s);
  ctx.quadraticCurveTo(x + 7 * s, y + 18 * s, x + 11 * s, y);
  ctx.lineTo(x + 15 * s, y);
  ctx.quadraticCurveTo(x + 17 * s, y + 18 * s, x + 16 * s, y + 34 * s);
  ctx.closePath();
  const tg = ctx.createLinearGradient(0, y, 0, y + 34 * s);
  tg.addColorStop(0, shade("#7a4c22", 0.12)); tg.addColorStop(1, shade("#7a4c22", -0.12));
  ctx.fillStyle = tg; ctx.fill(); ctx.stroke();
  // Wurzeln
  ell(ctx, x + 5 * s, y + 33 * s, 5 * s, 2.5 * s, "#6b4120");
  ell(ctx, x + 20 * s, y + 33 * s, 5 * s, 2.5 * s, "#5e3a18");
  // Krone: ueberlappende weiche Blobs
  ell(ctx, x + 12 * s, y - 16 * s, 25 * s, 15 * s, "#7ea86a", false);
  ell(ctx, x + 2 * s, y - 22 * s, 14 * s, 10 * s, "#8db477", false);
  ell(ctx, x + 22 * s, y - 24 * s, 12 * s, 9 * s, "#98bd82", false);
  ctx.strokeStyle = INK; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.ellipse(x + 12 * s, y - 17 * s, 25 * s, 16 * s, 0, 0, Math.PI * 2); ctx.stroke();
  // Licht-Dabs
  ctx.globalAlpha = 0.5;
  ell(ctx, x + 4 * s, y - 24 * s, 5 * s, 3 * s, "#b3d49e", false);
  ell(ctx, x + 24 * s, y - 20 * s, 4 * s, 2.5 * s, "#b3d49e", false);
  ctx.globalAlpha = 1;
  RN(ctx, x - 8 * s, y - 4 * s, 12 * s, 4 * s, "rgba(74,104,58,0.35)");
}
// Busch: weiche Blobs
function bush(ctx, x, y, s) {
  s = s || 1;
  ell(ctx, x + 13 * s, y + 8 * s, 14 * s, 8 * s, "#7ea86a", false);
  ell(ctx, x + 8 * s, y + 4 * s, 8 * s, 6 * s, "#8db477", false);
  ell(ctx, x + 19 * s, y + 5 * s, 7 * s, 5 * s, "#98bd82", false);
  ctx.globalAlpha = 0.5;
  ell(ctx, x + 8 * s, y + 2 * s, 4 * s, 2 * s, "#b3d49e", false);
  ctx.globalAlpha = 1;
}
// Wasser: Aquarell-Wash mit animierten Wellenlinien und weichem Rand
function water(ctx, x, y, w, h, t) {
  rr(ctx, x - 2, y - 2, w + 4, h + 4, "#5e86a8", false, 3);
  const gr = ctx.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, "#8fbcd8");
  gr.addColorStop(0.6, "#6d9cc0");
  gr.addColorStop(1, "#55809f");
  ctx.fillStyle = gr;
  ctx.fillRect(x, y, w, h);
  const ph = (t || 0) / 500;
  ctx.strokeStyle = "rgba(226,238,242,0.55)";
  ctx.lineWidth = 1.2;
  for (let i = 0; i < w; i += 22) {
    ctx.beginPath();
    const yy = y + 10 + Math.sin(ph + i * 0.2) * 3;
    ctx.moveTo(x + i, yy);
    ctx.quadraticCurveTo(x + i + 6, yy - 3, x + i + 12, yy);
    ctx.stroke();
    if (i % 44 === 0) {
      ctx.beginPath();
      const y2 = y + 22 + Math.cos(ph * 1.3 + i * 0.15) * 3;
      ctx.moveTo(x + i + 4, y2);
      ctx.quadraticCurveTo(x + i + 10, y2 - 3, x + i + 16, y2);
      ctx.stroke();
    }
  }
  RN(ctx, x, y, w, 3, "rgba(242,248,250,0.4)");
}
// ---- Storybook-Figuren: runde Koepfe, sanfte Gesichter ----
function person(ctx, x, y, o, t) {
  const bob = Math.sin((t || 0) / 600) * 1.5;
  const skin = o.skin || "#f0c090", dark = o.skinDark || "#d09868";
  RN(ctx, x - 15, y + 1, 30, 5, "rgba(74,58,40,0.22)");
  // Beine + Schuhe
  if (!o.skirt) {
    rr(ctx, x - 9, y - 16, 7, 14, "#6a5838"); rr(ctx, x + 2, y - 16, 7, 14, "#6a5838");
    rr(ctx, x - 11, y - 5, 10, 6, "#3a2c20"); rr(ctx, x + 1, y - 5, 10, 6, "#3a2c20");
  } else {
    // Kleid: trapezfoermig mit weichem Wash
    ctx.strokeStyle = INK; ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(x - 9, y - 18); ctx.lineTo(x + 9, y - 18);
    ctx.lineTo(x + 15, y); ctx.lineTo(x - 15, y);
    ctx.closePath();
    const dg = ctx.createLinearGradient(0, y - 18, 0, y);
    dg.addColorStop(0, shade(o.tunic, 0.12)); dg.addColorStop(1, shade(o.tunic, -0.14));
    ctx.fillStyle = dg; ctx.fill(); ctx.stroke();
    rr(ctx, x - 10, y - 5, 7, 6, "#3a2c20"); rr(ctx, x + 3, y - 5, 7, 6, "#3a2c20");
  }
  // Torso mit Falten-Wash
  rr(ctx, x - 14, y - 40, 28, 26, o.tunic);
  RN(ctx, x - 14, y - 40, 28, 4, shade(o.trim || o.tunic, 0.18));
  ctx.globalAlpha = 0.4;
  RN(ctx, x - 7, y - 35, 3, 20, o.tunicDark || "rgba(84,62,42,0.3)");
  RN(ctx, x + 5, y - 33, 3, 18, o.tunicDark || "rgba(84,62,42,0.3)");
  ctx.globalAlpha = 1;
  // Toga-Bausch
  ell(ctx, x - 13, y - 32, 6, 9, o.trim || o.tunic);
  // Arme + Haende
  rr(ctx, x - 19, y - 38, 6, 20, o.tunic); rr(ctx, x + 13, y - 38, 6, 20, o.tunic);
  ell(ctx, x - 16, y - 17, 4, 4, skin); ell(ctx, x + 16, y - 17, 4, 4, skin);
  // ---- Kopf: gross und rund ----
  ell(ctx, x, y - 53 + bob, 15, 14, skin);
  RN(ctx, x - 13, y - 44 + bob, 26, 3, "rgba(180,140,100,0.3)");
  // Haar: weiche Kappe mit Stirnfransen
  ctx.strokeStyle = INK; ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.ellipse(x, y - 63 + bob, 16, 10, 0, Math.PI, 0);
  ctx.fillStyle = o.hair; ctx.fill(); ctx.stroke();
  ell(ctx, x - 14, y - 57 + bob, 4, 7, o.hair, false);
  ell(ctx, x + 14, y - 57 + bob, 4, 7, o.hair, false);
  ctx.globalAlpha = 0.6;
  RN(ctx, x - 12, y - 66 + bob, 24, 2, "rgba(255,244,220,0.5)");
  ctx.globalAlpha = 1;
  // Ohren
  ell(ctx, x - 15, y - 54 + bob, 3, 4, skin); ell(ctx, x + 15, y - 54 + bob, 3, 4, skin);
  // Runde Augen mit Glanzpunkt
  ell(ctx, x - 6, y - 54 + bob, 4, 4.5, "#fffdf6", false);

// Feles (Katze): weiche Ellipsen, geschwungener Schweif, Glow-Augen
function cat(ctx, x, y, t) {
  const bob = Math.sin((t || 0) / 300) * 2;
  const fur = "#e0a840", dark = "#b8842a", cream = "#f8e8c8";
  RN(ctx, x - 3, y + 24, 42, 4, "rgba(74,58,40,0.2)");

  ctx.strokeStyle = fur;

  ctx.quadraticCurveTo(x - 10, y + 16 + bob, x - 12, y + 3 + bob + tw);

  ell(ctx, x + 30, y - 1 + bob, 11, 9.5, fur);
  ell(ctx, x + 21, y + 1 + bob, 5, 5, cream, false);

  ctx.beginPath();
  ctx.moveTo(x + 21, y - 8 + bob); ctx.quadraticCurveTo(x + 20, y - 15 + bob, x + 26, y - 12 + bob);
  ctx.quadraticCurveTo(x + 25, y - 7 + bob, x + 21, y - 8 + bob);
  ctx.closePath();
  ctx.fillStyle = fur; ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 39, y - 8 + bob); ctx.quadraticCurveTo(x + 40, y - 15 + bob, x + 34, y - 12 + bob);
  ctx.quadraticCurveTo(x + 35, y - 7 + bob, x + 39, y - 8 + bob);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.globalAlpha = 0.6;

  RN(ctx, x + 34, y - 12 + bob, 3, 4, "#8a5a20");

  ctx.fillStyle = "#e8f4e0";
  ctx.beginPath(); ctx.arc(x + 26.7, y - 2.8 + bob, 0.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 34.7, y - 2.8 + bob, 0.6, 0, Math.PI * 2); ctx.fill();
  // Nase + Mund (Katten-Y)
  ctx.fillStyle = "#d05868";
  ctx.beginPath(); ctx.arc(x + 30, y + 2 + bob, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#8a5a20"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + 30, y + 3.5 + bob); ctx.lineTo(x + 30, y + 5 + bob);
  ctx.moveTo(x + 30, y + 5 + bob); ctx.quadraticCurveTo(x + 27.5, y + 7 + bob, x + 26, y + 5.5 + bob);
  ctx.moveTo(x + 30, y + 5 + bob); ctx.quadraticCurveTo(x + 32.5, y + 7 + bob, x + 34, y + 5.5 + bob);

// Sterne: funkeln mit weichem Glow
function stars(ctx, t) {
  for (let i = 0; i < 36; i++) {
    const x = (i * 89 + 13) % 640, y = (i * 53) % 200;
    const tw2 = Math.sin((t || 0) / 500 + i * 1.3);
    if (tw2 > -0.2) {
      ctx.globalAlpha = 0.25 + Math.max(0, tw2) * 0.3;
      ell(ctx, x + 1, y + 1, 3, 3, "#f8f0c8", false);
      ctx.globalAlpha = 0.9;
      RN(ctx, x, y, 2.5, 2.5, "#f8f4d8");
      ctx.globalAlpha = 1;
    }
  }
}
// Steinboden: gedämpfte warme Töne
function stoneFloor(ctx, y) {

// Tuer: Maserung + runde Klinke
function door(ctx, x, y, w, h) {
  rr(ctx, x - 3, y - 3, w + 6, h + 6, "#6b5138");
  rr(ctx, x, y, w, h, "#a06a38");
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = "#7a5028"; ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(x + 4 + i * (w - 8) / 3, y + 3);
    ctx.quadraticCurveTo(x + 6 + i * (w - 8) / 3, y + h / 2, x + 4 + i * (w - 8) / 3, y + h - 3);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  RN(ctx, x + w / 2 - 1, y, 2, h, "rgba(107,81,56,0.5)");
  rr(ctx, x + 5, y + h / 3, w - 10, 4, "#5c422e");
  rr(ctx, x + 5, y + h * 2 / 3, w - 10, 4, "#5c422e");
  ell(ctx, x + w - 10, y + h / 2, 4, 4, "#e8c040");
  ctx.globalAlpha = 0.6;
  ell(ctx, x + w - 11, y + h / 2 - 1, 1.5, 1.5, "#f8e8a0", false);
  ctx.globalAlpha = 1;
}
// Fenster: gedeckter Rahmen, ggf. warm erleuchtet mit Glow
function windowFrame(ctx, x, y, w, h, lit) {
  rr(ctx, x - 3, y - 3, w + 6, h + 6, "#6b5138");
  if (lit) {
    const gr = ctx.createRadialGradient(x + w / 2, y + h / 2, 2, x + w / 2, y + h / 2, w);
    gr.addColorStop(0, "#f8e8a0"); gr.addColorStop(1, "#e8b968");
    ctx.fillStyle = gr;
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = 0.25;
    ell(ctx, x + w / 2, y + h / 2, w * 0.9, h * 0.9, "#f8d878", false);
    ctx.globalAlpha = 1;
  } else {
    rr(ctx, x, y, w, h, "#9ec2d4");
    ctx.globalAlpha = 0.4;
    RN(ctx, x + 2, y + 2, w - 4, 3, "#e8f2f8");
    ctx.globalAlpha = 1;
  }
  rr(ctx, x + w / 2 - 1.5, y - 1, 3, h + 2, "#6b5138");
  rr(ctx, x - 1, y + h / 2 - 1.5, w + 2, 3, "#6b5138");
}
// Fackel: warmes radial- Glow + weiche Flamme
function torch(ctx, x, y, t) {
  const fl = Math.sin((t || 0) / 90) * 2;
  const gr = ctx.createRadialGradient(x, y - 8 + fl, 2, x, y - 8, 34);
  gr.addColorStop(0, "rgba(248,200,80,0.35)");
  gr.addColorStop(1, "rgba(248,200,80,0)");
  ctx.fillStyle = gr;
  ctx.fillRect(x - 34, y - 42, 68, 76);
  rr(ctx, x - 2.5, y, 5, 16, "#6a4c2c");
  ell(ctx, x, y - 2, 5, 3.5, "#4a3828");
  // Flamme: weiche Tropfenform
  ctx.strokeStyle = INK; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, y - 16 + fl);
  ctx.quadraticCurveTo(x + 5, y - 9 + fl, x, y - 4 + fl);
  ctx.quadraticCurveTo(x - 5, y - 9 + fl, x, y - 16 + fl);
  ctx.closePath();
  const fg = ctx.createLinearGradient(0, y - 16 + fl, 0, y - 4 + fl);
  fg.addColorStop(0, "#f8d868"); fg.addColorStop(0.6, "#f0a040"); fg.addColorStop(1, "#e07830");
  ctx.fillStyle = fg; ctx.fill();
  ctx.globalAlpha = 0.6;
  ell(ctx, x, y - 9 + fl, 1.8, 3, "#fdf0b0", false);
  ctx.globalAlpha = 1;
}
// Altarfeuer: Glow + weiche Flammen
function altarFire(ctx, x, y, t, big) {
  const s = big ? 2 : 1, fl = Math.sin((t || 0) / 80) * 3;
  const gr = ctx.createRadialGradient(x, y - 6, 2, x, y - 6, 30 * s);
  gr.addColorStop(0, "rgba(248,180,70,0.32)");
  gr.addColorStop(1, "rgba(248,180,70,0)");
  ctx.fillStyle = gr;
  ctx.fillRect(x - 30 * s, y - 36 * s, 60 * s, 46 * s);
  rr(ctx, x - 12 * s, y, 24 * s, 8 * s, "#c4ac80");
  rr(ctx, x - 14 * s, y + 6 * s, 28 * s, 4 * s, "#a89268");
  ell(ctx, x - 3 * s, y - 1, 7 * s, 2.5 * s, "#7a5428");
  // Flammen
  const fx = x, fy = y - 4 * s - fl;
  ctx.strokeStyle = INK; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(fx, fy - 14 * s);
  ctx.quadraticCurveTo(fx + 7 * s, fy - 6 * s, fx, fy);
  ctx.quadraticCurveTo(fx - 7 * s, fy - 6 * s, fx, fy - 14 * s);
  ctx.closePath();
  const fgr = ctx.createLinearGradient(0, fy - 14 * s, 0, fy);
  fgr.addColorStop(0, "#f8d868"); fgr.addColorStop(0.5, "#f0a040"); fgr.addColorStop(1, "#e07830");
  ctx.fillStyle = fgr; ctx.fill();
  ctx.globalAlpha = 0.6;
  ell(ctx, fx, fy - 6 * s, 2 * s, 4 * s, "#fdf0b0", false);
  ctx.globalAlpha = 1;
}

    RN(ctx, 54, 184, 54, 5, "#f8f0b0");
    // Häuser rechts
    R(ctx, 400, 80, 200, 190, "#383050");
    roofTiles(ctx, 392, 62, 216, 20);
    RN(ctx, 594, 80, 6, 190, "#2c2438");
    windowFrame(ctx, 430, 130, 36, 44, false);
    windowFrame(ctx, 500, 130, 36, 44, true);
    torch(ctx, 380, 158, t);
    // Laterne mit Lichtkegel
    R(ctx, 610, 150, 8, 62, "#443c50");
    R(ctx, 600, 138, 26, 20, "#443c50");
    R(ctx, 604, 142, 18, 15, "#f8e060");
    RN(ctx, 594, 158, 38, 42, "rgba(248,224,96,0.14)");
    // Senex mit Stab
    person(ctx, 260, 300, { skin: "#e0b088", hair: "#d8d0c0", tunic: "#2c3850", trim: "#3c4860", tunicDark: "#1e2840", skirt: false }, t);
    R(ctx, 300, 238, 7, 62, "#6a5438");
    R(ctx, 294, 230, 15, 10, "#7a6448");
    R(ctx, 320, 288, 16, 14, "#443c50"); // Bodenlaterne
    RN(ctx, 323, 291, 9, 9, "#f8e060");
    cat(ctx, 180, 330, t);
  },
  hotspots: [
    { x: 248, y: 170, w: 100, h: 120, la: "senex",
      onUse(s, G) {
        G.verbaAdd("nox");
        if (G.has("corona") && G.has("stella")) {
          return { type: "dialog", lines: [
            ["Senex", "In nocte ianua latet..."],
            ["Senex", "Corona stellaque lucent – viam monstrant!"],
            ["Feles", "Miau! Corona et stella in nocte lucent: ianua festi aperitur!"]
          ], choice: {
            prompt: "Senex dicit: \"Quid Ceres donat?\"",
            options: [
              { la: "Terra fructum dat.", ok: true,
                next: [["Senex", "Recte! Ceres est dea frugum. Ianua aperitur!"]], flag: "via_fest" },
              { la: "Pecunia vilis est.", ok: false,
                next: [["Senex", "Non recte! De Cere cogita!"]] },
              { la: "Feles sagittam amat.", ok: false,
                next: [["Senex", "Absurdum! De Cere cogita!"]] }
            ]
          } };
        }
        return { type: "dialog", lines: [
          ["Senex", "Ianua festi nocte latet."],
          ["Senex", "Corona et stella viam monstrant – quaere!"]
        ] };
      } },
    { x: 96, y: 180, w: 60, h: 86, la: "ianua",
      onUse(s, G) {
        if (G.flag("via_fest")) {
          return { type: "goto", target: "festum" };
        }
        return { type: "text", la: "Ianua clausa est. Senex nocte prope ianuam stat." };
      } },
    { x: 500, y: 130, w: 40, h: 44, la: "lumen",
      onUse(s, G) { return { type: "text", la: "Lumen in fenestra lucet." }; } },
    { x: 180, y: 290, w: 70, h: 70, la: "feles",
      onUse(s, G) { return { type: "feles", text: "Miau! Nox = die Nacht. In nocte oculi Feles lucent!" }; } }
  ],
  exits: [
    { x: 0, y: 0, w: 320, h: 30, la: "templum", target: "templum" },
    { x: 320, y: 0, w: 320, h: 30, la: "macellum", target: "macellum" }
  ]
};

// ---------- SZENE 10: Festum (Finale) ----------
SCENES.festum = {
  name: "Festum Ceres",
  draw(ctx, t) {
    skyGradient(ctx, "#282048", "#483868", "#684878");
    stars(ctx, t);
    RN(ctx, 0, 240, 640, 120, "#9a7a50");
    tiles(ctx, 0, 240, 640, 120, 40, 20, "#ac8a58", "#9a7a50");
    // Festzelte
    for (let i = 0; i < 3; i++) {
      const zx = 30 + i * 200;
      for (let m = 0; m < 6; m++) R(ctx, zx + m * 20, 118, 22, 18, m % 2 ? "#f0e8d8" : "#e05858");
      RN(ctx, zx, 134, 122, 6, "#c04848");
      R(ctx, zx + 6, 140, 9, 102, "#7a5428"); R(ctx, zx + 107, 140, 9, 102, "#7a5428");
    }
    for (let i = 0; i < 5; i++) altarFire(ctx, 80 + i * 120, 210, t, false);
    // Ceres-Schrein
    R(ctx, 260, 160, 120, 80, "#f0ead4");
    RN(ctx, 260, 160, 120, 10, "#d0c098");
    R(ctx, 264, 174, 112, 58, "#e4d8b8");
    altarFire(ctx, 320, 156, t, true);
    // Ähre
    R(ctx, 314, 188, 14, 36, "#e8c858");
    R(ctx, 309, 182, 24, 11, "#f8e0a0");
    for (let g = 0; g < 4; g++) { RN(ctx, 311 - g, 196 + g * 8, 7, 5, "#f8e0a0"); RN(ctx, 323 + g, 196 + g * 8, 7, 5, "#f8e0a0"); }
    // Girlanden
    for (let i = 0; i < 6; i++) {
      const gx = 40 + i * 110;
      for (let g = 0; g < 6; g++) R(ctx, gx + g * 9, 138 + Math.sin(g * 1.2) * 8, 7, 7, g % 2 ? "#e86070" : "#f0e060");
    }
    person(ctx, 120, 320, { skin: "#f0c090", hair: "#2a1a10", tunic: "#e05848", trim: "#f88070", tunicDark: "#b83c30", skirt: false }, t);
    person(ctx, 190, 330, { skin: "#f0c090", hair: "#e0b860", tunic: "#5870e0", trim: "#8098f0", tunicDark: "#4058b8", skirt: true }, t);
    person(ctx, 500, 320, { skin: "#e0b080", hair: "#4a3018", tunic: "#4aa858", trim: "#70c878", tunicDark: "#388c40", skirt: false }, t);
    person(ctx, 440, 260, { skin: "#f0c090", hair: "#4a3018", tunic: "#faf4e4", trim: "#e8c040", tunicDark: "#d8d0b0", skirt: true }, t);
    cat(ctx, 250, 340, t);
    // Konfetti
    for (let i = 0; i < 12; i++) {
      const fx = (i * 73 + (t || 0) / 50) % 640;
      const fy = 100 + ((i * 47 + (t || 0) / 30) % 160);
      R(ctx, fx, fy, 5, 5, i % 3 === 0 ? "#f8e060" : (i % 3 === 1 ? "#e86070" : "#78c878"));
    }
  },
  hotspots: [
    { x: 260, y: 100, w: 120, h: 140, la: "ara",
      onUse(s, G) {
        if (G.flag("fest_done")) return { type: "text", la: "Ceres laeta est. Festum agitur!" };
        if (G.has("frumentum") && G.has("corona") && G.has("stella")) {
          return { type: "dialog", lines: [
            ["Sacerdos", "Omnia dona habes! Dona Ceres da!"],
            ["Feles", "Miau! Frumentum, corona, stella – omnia dona sunt!"]
          ], choice: {
            prompt: "Copia respondet: \"Ceres dea est...\"",
            options: [
              { la: "Terra fructum dat.", ok: true,
                next: [["Sacerdos", "Recte! Ceres dona accipit – festum incipit!"]],
                win: true },
              { la: "Annona mala est.", ok: false,
                next: [["Sacerdos", "Non recte! Iterum cogita!"]] }
            ]
          } };
        }
        return { type: "text", la: "Ara dona exspectat: frumentum, corona, stella." };
      } },
    { x: 250, y: 290, w: 70, h: 70, la: "feles",
      onUse(s, G) { return { type: "feles", text: "Miau! Festum = das Fest. Omnes laeti sunt! Ceres te amat!" }; } },
    { x: 100, y: 260, w: 100, h: 120, la: "populus",
      onUse(s, G) { return { type: "text", la: "Populus laetus festum celebrat." }; } }
  ],
  exits: [
    { x: 0, y: 0, w: 640, h: 30, la: "vicus nocturnus", target: "vicus_nocturnus" }
  ]
};

</script>
<script>
// game.js – Engine: Ein-Klick-Steuerung, Inventar + Kombinieren,
// Dialogsystem, Verba-Register, Feles-Hinweise, Web-Audio-Musik/Sounds.

const ITEMS = {
  pecunia: { la: "pecunia", de: "Geld" },
  panis: { la: "panis", de: "Brot" },
  flores: { la: "flores", de: "Blumen" },
  frumentum: { la: "frumentum", de: "Getreide" },
  vinum: { la: "vinum", de: "Wein" },
  sagitta: { la: "sagitta", de: "Pfeil" },
  clavis: { la: "clavis", de: "Schlüssel" },
  corona_rohling: { la: "corona rudis", de: "Kranz-Rohling" },
  stella: { la: "stella", de: "Stern" },
  corona: { la: "corona", de: "Kranz" }
};

// Kombinationen (Inventar-Mechanik)
const COMBINES = [
  { a: "flores", b: "corona_rohling", la: "Flores et corona rudis!",
    hint: "Miau! In theatro histrio coronam perficit – non hic!" },
  { a: "frumentum", b: "corona", la: "Dona duo – sed stella deest!",
    hint: "Miau! Dona tria necessaria sunt: frumentum, corona, stella!" }
];

const G = {
  char: null,
  scene: "atrium",
  inventory: [],
  selected: null,
  flags: {},
  verba: new Set(),

  has(item) { return this.inventory.includes(item); },
  addItem(item) { if (!this.has(item)) this.inventory.push(item); },
  removeItem(item) {
    const i = this.inventory.indexOf(item);
    if (i >= 0) this.inventory.splice(i, 1);
    if (this.selected === item) this.selected = null;
  },
  flag(f) { return !!this.flags[f]; },
  setFlag(f) { this.flags[f] = true; },
  verbaAdd(la) {
    if (VERBA_MAP[la] && !this.verba.has(la)) {
      this.verba.add(la);
      updateVerbaCount();
      sound("collect");
    }
  }
};

// ---------- Audio (Web Audio API) ----------
let audioCtx = null, musicOn = true;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type, vol, when) {
  const ctx = ensureAudio();
  if (!ctx) return;
  const t0 = ctx.currentTime + (when || 0);
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.08, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur);
}
function sound(kind) {
  if (kind === "click") tone(440, 0.06, "square", 0.05);
  if (kind === "collect") { tone(660, 0.08, "square", 0.06); tone(880, 0.1, "square", 0.06, 0.08); }
  if (kind === "take") { tone(520, 0.1, "triangle", 0.08); tone(780, 0.12, "triangle", 0.08, 0.1); }
  if (kind === "error") tone(180, 0.2, "sawtooth", 0.06);
  if (kind === "meow") { tone(700, 0.15, "sine", 0.07); tone(550, 0.2, "sine", 0.06, 0.12); }
  if (kind === "win") [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, "triangle", 0.08, i * 0.15));
}
let musicTimer = null;
function startMusic() {
  if (musicTimer || !ensureAudio()) return;
  const melody = [392, 440, 494, 440, 392, 349, 392, 0, 330, 392, 440, 392, 349, 330, 294, 0];
  let step = 0;
  musicTimer = setInterval(() => {
    if (!musicOn) return;
    const f = melody[step % melody.length];
    if (f) tone(f, 0.35, "triangle", 0.03);
    if (step % 4 === 0) tone(98, 0.5, "sine", 0.05);
    step++;
  }, 420);
}

// ---------- Rendering ----------
const canvas = document.getElementById("stage");
const ctx2d = canvas.getContext("2d");
ctx2d.scale(2, 2);
let hoverSpot = null;

function loop(t) {
  const sc = SCENES[G.scene];
  ctx2d.clearRect(0, 0, 640, 360); // nach ctx.scale(2,2) deckt dies die volle 1280x720 ab
  sc.draw(ctx2d, t || 0);
  // Dauerhaft sichtbare Ausgangs-Buttons (Schilder mit Richtungspfeil + Ziel)
  sc.exits.forEach(ex => {
    const hovered = hoverSpot === ex;
    const bw = Math.min(ex.w, 150), bx = ex.x + (ex.w - bw) / 2;
    // Schild-Hintergrund
    ctx2d.fillStyle = hovered ? "rgba(60,44,20,0.95)" : "rgba(30,22,12,0.85)";
    ctx2d.fillRect(bx, ex.y + 2, bw, 28);
    // Rahmen
    ctx2d.strokeStyle = hovered ? "#f8e8b0" : "#d4a545";
    ctx2d.lineWidth = 2;
    ctx2d.strokeRect(bx + 1, ex.y + 3, bw - 2, 26);
    // Richtungspfeil
    ctx2d.fillStyle = "#d4a545";
    const cy = ex.y + 16;
    const left = /macellum|atrium|domus|hortus/.test(ex.target) && ex.target !== "hortus" ? false : (ex.x < 320);
    if (left) {
      ctx2d.beginPath();
      ctx2d.moveTo(bx + 26, cy - 7); ctx2d.lineTo(bx + 12, cy); ctx2d.lineTo(bx + 26, cy + 7);
      ctx2d.closePath(); ctx2d.fill();
    } else {
      ctx2d.beginPath();
      ctx2d.moveTo(bx + bw - 26, cy - 7); ctx2d.lineTo(bx + bw - 12, cy); ctx2d.lineTo(bx + bw - 26, cy + 7);
      ctx2d.closePath(); ctx2d.fill();
    }
    // Ziel-Beschriftung
    ctx2d.fillStyle = "#f8e8b0";
    ctx2d.font = "bold 13px Georgia";
    ctx2d.textAlign = "center";
    ctx2d.textBaseline = "middle";
    const label = "» " + (SCENES[ex.target] ? SCENES[ex.target].name : ex.la);
    ctx2d.fillText(label, bx + bw / 2, cy);
  });
  if (hoverSpot) {
    ctx2d.strokeStyle = "#f8e8b0";
    ctx2d.lineWidth = 2;
    ctx2d.strokeRect(hoverSpot.x + 1, hoverSpot.y + 1, hoverSpot.w - 2, hoverSpot.h - 2);
  }
  requestAnimationFrame(loop);
}

// ---------- Dialogsystem ----------
const dialogBox = document.getElementById("dialog-box");
const dSpeaker = document.getElementById("speaker");
const dText = document.getElementById("text");
const dChoices = document.getElementById("choices");
const dNext = document.getElementById("dialog-next");
let dialogQueue = [], dialogAfter = null;

function showText(speaker, text) {
  dialogBox.hidden = false;
  dSpeaker.textContent = speaker;
  dText.textContent = text;
  dChoices.innerHTML = "";
  dNext.style.display = "block";
}
function showDialog(lines, after) {
  dialogQueue = lines.slice();
  dialogAfter = after || null;
  const [sp, tx] = dialogQueue.shift();
  showText(sp, tx);
}
function showChoice(ch) {
  dialogBox.hidden = false;
  dSpeaker.textContent = "??";
  dText.textContent = ch.prompt;
  dNext.style.display = "none";
  dChoices.innerHTML = "";
  ch.options.forEach(opt => {
    const b = document.createElement("button");
    b.textContent = opt.la;
    b.onclick = () => {
      dChoices.innerHTML = "";
      sound(opt.ok ? "collect" : "error");
      if (opt.ok) {
        if (opt.flag) G.setFlag(opt.flag);
        showDialog(opt.next, () => {
          if (opt.win) {
            G.removeItem("frumentum"); G.removeItem("corona"); G.removeItem("stella");
            G.setFlag("fest_done");
            sound("win");
            showDialog([
              ["Ceres", "Donaria accipio – terra fructum dabit!"],
              ["Feles", "Miau! Festum incipit! Verba " + G.verba.size + " collegisti!"],
              ["Omnes", "FELIX FESTUM CERES! 🌾👑⭐"]
            ]);
          }
        });
      } else {
        showDialog(opt.next, () => {});
      }
    };
    dChoices.appendChild(b);
  });
}
function advanceDialog() {
  if (dChoices.children.length > 0) return;
  if (dialogQueue.length > 0) {
    const [sp, tx] = dialogQueue.shift();
    showText(sp, tx);
  } else {
    dialogBox.hidden = true;
    const fn = dialogAfter; dialogAfter = null;
    if (fn) fn();
  }
}
dialogBox.addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") advanceDialog();
});
dNext.addEventListener("click", advanceDialog);

// ---------- Feles ----------
const felesBox = document.getElementById("feles-box");
const felesText = document.getElementById("feles-text");
document.getElementById("feles-close").addEventListener("click", () => {
  felesBox.hidden = true;
});
function showFeles(text) {
  sound("meow");
  felesBox.hidden = false;
  felesText.textContent = text;
  clearTimeout(showFeles._t);
  showFeles._t = setTimeout(() => { felesBox.hidden = true; }, 9000);
}

// ---------- Verba-Register ----------
function updateVerbaCount() {
  document.getElementById("verba-count").textContent = G.verba.size;
}
document.getElementById("verba-counter").addEventListener("click", () => {
  const list = [...G.verba].map(la => {
    const v = VERBA_MAP[la];
    return "★ " + la + " – " + v.de;
  }).join("\n") || "Nondum verba collegisti!";
  showFeles("VERBA COLLECTA (" + G.verba.size + "):\n" + list);
});

// ---------- Inventar ----------
const invEl = document.getElementById("inventory");
function renderInventory() {
  invEl.innerHTML = "";
  G.inventory.forEach(item => {
    const li = document.createElement("li");
    const info = ITEMS[item];
    li.textContent = (G.selected === item ? "▸ " : "") + info.la;
    if (G.selected === item) li.classList.add("selected");
    li.title = info.de;
    li.onclick = () => {
      if (G.selected === item) { G.selected = null; }
      else {
        if (G.selected) tryCombine(G.selected, item);
        else { G.selected = item; sound("click"); }
      }
      renderInventory();
    };
    invEl.appendChild(li);
  });
}
function tryCombine(a, b) {
  G.selected = null;
  const c = COMBINES.find(c =>
    (c.a === a && c.b === b) || (c.a === b && c.b === a));
  if (c) {
    sound("take");
    showFeles(c.hint || c.la);
  } else {
    sound("error");
    showFeles("Miau! Haec duo non combinantur.");
  }
}

// ---------- Hotspot-Handling ----------
function applyResult(res) {
  if (!res) return;
  if (res.give) { G.addItem(res.give); }
  if (res.give2) { G.addItem(res.give2); }
  if (res.take) { G.removeItem(res.take); }
  renderInventory();
  if (res.verbum) G.verbaAdd(res.verbum);
  if (res.type === "text") { showText(G.char === "lucius" ? "Lucius" : "Aurelia", res.la); sound("click"); }
  if (res.type === "take") {
    G.addItem(res.item); renderInventory(); sound("take");
    showText("Feles", res.la || (ITEMS[res.item].la + " in saccum mitto!"));
  }
  if (res.type === "dialog") {
    const lines = res.lines.slice();
    if (res.give || res.give2) {
      const item = res.give || res.give2;
      lines.push(["Feles", ITEMS[item].la + " in saccā est!"]);
    }
    showDialog(lines, res.choice ? () => showChoice(res.choice) : null);
  }
  if (res.type === "feles") showFeles(res.text);
  if (res.type === "choice") showChoice(res.choice);
  if (res.type === "goto") { G.scene = res.target; updateSceneName(); sound("click"); }
}
function updateSceneName() {
  document.getElementById("scene-name").textContent = "» " + SCENES[G.scene].name;
}

function spotAt(x, y, spots) {
  for (const sp of spots) {
    if (x >= sp.x && x <= sp.x + sp.w && y >= sp.y && y <= sp.y + sp.h) return sp;
  }
  return null;
}
function stageCoords(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width * 640,
    y: (e.clientY - r.top) / r.height * 360
  };
}
canvas.addEventListener("mousemove", e => {
  const { x, y } = stageCoords(e);
  const sc = SCENES[G.scene];
  hoverSpot = spotAt(x, y, sc.hotspots) || spotAt(x, y, sc.exits);
  canvas.style.cursor = hoverSpot ? "pointer" : "default";
});
canvas.addEventListener("click", e => {
  ensureAudio();
  if (!dialogBox.hidden) return;
  const { x, y } = stageCoords(e);
  const sc = SCENES[G.scene];
  const exit = spotAt(x, y, sc.exits);
  if (exit) {
    sound("click");
    G.scene = exit.target;
    updateSceneName();
    return;
  }
  const sp = spotAt(x, y, sc.hotspots);
  if (sp) {
    sound("click");
    G.verbaAdd(sp.la);
    const res = sp.onUse ? sp.onUse(sc, G) : null;
    if (!res && sp.target) {
      G.scene = sp.target; updateSceneName(); return;
    }
    applyResult(res);
  }
});

// ---------- Titel & Start ----------
document.querySelectorAll(".char-card").forEach(btn => {
  btn.addEventListener("click", () => {
    G.char = btn.dataset.char;
    document.getElementById("title-screen").hidden = true;
    document.getElementById("game").hidden = false;
    ensureAudio();
    startMusic();
    updateSceneName();
    renderInventory();
    updateVerbaCount();
    sound("meow");
    showDialog([
      ["Feles", "Miau! Ego sum Feles, auxilium tuum!"],
      [G.char === "lucius" ? "Lucius" : "Aurelia",
        G.char === "lucius"
          ? "Ego Lucius sum! Festum Ceres exspecto!"
          : "Ego Aurelia sum! Vias latentes amo!"],
      ["Feles", "Pecuniam a patre accipe, deinde frumentum eme! Verba collige!"]
    ]);
  });
});

requestAnimationFrame(loop);

</script>
