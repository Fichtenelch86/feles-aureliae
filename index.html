<script>
// scenes.js – 10 Szenen im Vintage-Storybook-Stil (640x360 logisch, 1280x720 intern)
// Stilmerkmale: kräftige schwarze Outlines, karikaturhafte Figuren mit
// übergroßen Köpfen und Comic-Augen, gesättigte Farben.
// Hotspots und Spiellogik sind gegenüber v2.1 exakt unverändert.

const SCENES = {};

// ---------- Flat-Cartoon-Zeichen-Helfer (Rebecca-Sugar-Style) ----------
// Stil: "soft, rounded flat-cartoon" (PromptDeck: rebecca-sugar-flat-cartoon)
// Flache Pastell-Fuellungen, minimale Schattierung (nur weicher Kontaktschatten),
// runde geometrische Formen, uebergrosse expressive Augen, keine Texturen.
// Alle Signaturen identisch - Hotspots/Spiellogik unveraendert.

const INK = "rgba(120,90,110,0.35)";
const INK_SOFT = "rgba(120,90,110,0.2)";

// Deterministischer Hash-RNG (stabile Texturen, kein Flackern)
function hash01(seed, i) {
  let h = (seed | 0) * 374761393 + (i | 0) * 668265263;
  h = (h ^ (h >>> 13)) * 1274126177;
  h = h ^ (h >>> 16);
  return ((h >>> 0) % 10000) / 10000;
}
function strSeed(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }
// Flat-Pastell: Farbe sanft entsaettigen und aufhellen (pastel-adjacent restraint)
function shade(hex, amt) {
  if (!hex || hex[0] !== "#") return hex;
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  if (isNaN(n)) return hex;
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const lum = 0.299 * r + 0.587 * g + 0.114 * b;
  // Richtung Pastell: zur Luminanz mischen + rosa-warmen Stich
  r = r * 0.35 + lum * 0.5 + 68;
  g = g * 0.35 + lum * 0.5 + 58;
  b = b * 0.35 + lum * 0.5 + 70;
  if (amt > 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else if (amt < 0) { r *= (1 + amt); g *= (1 + amt); b *= (1 + amt); }
  r = Math.min(255, r); g = Math.min(255, g); b = Math.min(255, b);
  return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
}
// Dunklere Variante fuer weiche Konturen (kein Schwarz!)
function edgeCol(col) { return shade(col, -0.3); }

// Abgerundetes Rechteck: FLACHE Farbe, weiche runde Kontur in Tonal-Abstufung
function rr(ctx, x, y, w, h, col, line, radius) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  const rad = Math.min(radius === undefined ? 5 : radius, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
  ctx.fillStyle = shade(col, 0);
  ctx.fill();
  if (line !== false) {
    ctx.strokeStyle = edgeCol(col);
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }
}
function R(ctx, x, y, w, h, col, line) { rr(ctx, x, y, w, h, col, line, 5); }
function RN(ctx, x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
// Ellipse: flach mit weicher Kontur
function ell(ctx, cx, cy, rx, ry, col, line) {
  ctx.beginPath();
  ctx.ellipse(cx, cy, Math.max(0.5, rx), Math.max(0.5, ry), 0, 0, Math.PI * 2);
  ctx.fillStyle = shade(col, 0);
  ctx.fill();
  if (line !== false) { ctx.strokeStyle = edgeCol(col); ctx.lineWidth = 1.4; ctx.stroke(); }
}
// Fliesen: flache Pastell-Kacheln, weiche Fugen, keine Schattierung
function tiles(ctx, x, y, w, h, tw, th, c1, c2) {
  for (let ty = y; ty < y + h; ty += th) {
    for (let tx = x; tx < x + w; tx += tw) {
      const alt = ((tx / tw + ty / th) | 0) % 2 === 0;
      rr(ctx, tx, ty, tw - 2, th - 2, alt ? c1 : c2, false, 3);
    }
  }
}
// Himmel: sanfter zweistufiger Flat-Wash (Pastell)
function skyGradient(ctx, top, mid, bot) {
  const gr = ctx.createLinearGradient(0, 0, 0, 360);
  gr.addColorStop(0, shade(top, 0.12));
  gr.addColorStop(1, shade(bot, 0.08));
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, 640, 360);
  ctx.fillStyle = shade(mid, 0.15);
  ctx.fillRect(0, 0, 640, 130);
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = shade(mid, 0);
  ctx.fillRect(0, 0, 640, 130);
  ctx.globalAlpha = 1;
}
// Wolke: flache weiche Blobs
function cloud(ctx, x, y, s) {
  s = s || 1;
  ell(ctx, x + 15 * s, y + 8 * s, 16 * s, 9 * s, "#fdfbf4", false);
  ell(ctx, x + 9 * s, y + 5 * s, 10 * s, 8 * s, "#fdfbf4", false);
  ell(ctx, x + 23 * s, y + 6 * s, 8 * s, 6 * s, "#f8f5ea", false);
}
// Baum: runde Kuschel-Krone, dicker kurzer Stamm
function tree(ctx, x, y, s) {
  s = s || 1;
  rr(ctx, x + 8 * s, y, 10 * s, 36 * s, "#a8785a");
  ell(ctx, x + 13 * s, y - 18 * s, 26 * s, 20 * s, "#8fcf8a", false);
  ell(ctx, x + 2 * s, y - 10 * s, 15 * s, 12 * s, "#9ad894", false);
  ell(ctx, x + 24 * s, y - 12 * s, 14 * s, 11 * s, "#a4de9d", false);
  ctx.globalAlpha = 0.5;
  ell(ctx, x + 6 * s, y - 26 * s, 9 * s, 6 * s, "#c4e8bd", false);
  ctx.globalAlpha = 1;
  ell(ctx, x + 4 * s, y + 34 * s, 6 * s, 3 * s, "#8a684c", false);
  ell(ctx, x + 22 * s, y + 34 * s, 6 * s, 3 * s, "#8a684c", false);
}
// Busch: flache runde Blobs
function bush(ctx, x, y, s) {
  s = s || 1;
  ell(ctx, x + 13 * s, y + 8 * s, 15 * s, 10 * s, "#8fcf8a", false);
  ell(ctx, x + 8 * s, y + 4 * s, 9 * s, 8 * s, "#9ad894", false);
  ell(ctx, x + 19 * s, y + 5 * s, 8 * s, 7 * s, "#a4de9d", false);
  ctx.globalAlpha = 0.5;
  ell(ctx, x + 8 * s, y + 2 * s, 4 * s, 3 * s, "#c4e8bd", false);
  ctx.globalAlpha = 1;
}
// Wasser: flache Pastell-Flaeche mit simplen Wellenlinien
function water(ctx, x, y, w, h, t) {
  rr(ctx, x - 2, y - 2, w + 4, h + 4, "#a8cfe8", false, 8);
  ctx.fillStyle = shade("#9cc8e8", 0);
  ctx.fillRect(x, y, w, h);
  const ph = (t || 0) / 500;
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  for (let i = 0; i < w; i += 26) {
    ctx.beginPath();
    const yy = y + 12 + Math.sin(ph + i * 0.2) * 3;
    ctx.moveTo(x + i + 4, yy);
    ctx.quadraticCurveTo(x + i + 10, yy - 3, x + i + 16, yy);
    ctx.stroke();
  }
  ctx.lineCap = "butt";
}
// ---- Flat-Cartoon-Figuren: Rebecca-Sugar-Look ----
// Grosser runder Kopf, uebergrosse Glanz-Augen, winziger Mund, Pastell-Toga
function person(ctx, x, y, o, t) {
  const bob = Math.sin((t || 0) / 600) * 1.5;
  const skin = o.skin || "#f5cfae", dark = o.skinDark || "#e8b28e";
  // weicher Kontaktschatten (einzige Schattierung)
  ctx.globalAlpha = 0.18;
  ell(ctx, x, y + 1, 20, 5, "#9a8494", false);
  ctx.globalAlpha = 1;
  // Beine + Schuhe: runde Stummel
  if (!o.skirt) {
    rr(ctx, x - 9, y - 16, 8, 15, "#a89078"); rr(ctx, x + 1, y - 16, 8, 15, "#a89078");
  } else {
    // Pastell-Kleid: Trapez mit weicher Rundung
    ctx.beginPath();
    ctx.moveTo(x - 10, y - 20); ctx.lineTo(x + 10, y - 20);
    ctx.lineTo(x + 17, y); ctx.lineTo(x - 17, y);
    ctx.closePath();
    ctx.fillStyle = shade(o.tunic, 0); ctx.fill();
    ctx.strokeStyle = edgeCol(o.tunic); ctx.lineWidth = 1.4; ctx.stroke();
  }
  rr(ctx, x - 12, y - 5, 11, 6, shade(o.tunic, -0.15)); rr(ctx, x + 1, y - 5, 11, 6, shade(o.tunic, -0.15));
  // Torso: kleine runde Form
  rr(ctx, x - 14, y - 40, 28, 24, o.tunic);
  rr(ctx, x - 14, y - 41, 28, 6, o.trim || o.tunic, false);
  // Toga-Bausch: runde Schulter
  ell(ctx, x - 13, y - 32, 7, 10, o.trim || o.tunic);
  // Arme: runde Stummel + Kugel-Haende
  rr(ctx, x - 20, y - 38, 7, 19, o.tunic); rr(ctx, x + 13, y - 38, 7, 19, o.tunic);
  ell(ctx, x - 16, y - 18, 4.5, 4.5, skin); ell(ctx, x + 16, y - 18, 4.5, 4.5, skin);
  // ---- GROSSER runder Kopf ----
  ell(ctx, x, y - 55 + bob, 16.5, 15.5, skin);
  // Haar: runde Kappe mit Kuhl
  ctx.beginPath();
  ctx.ellipse(x, y - 64 + bob, 17, 11, 0, Math.PI, 0);
  ctx.fillStyle = shade(o.hair, 0); ctx.fill();
  ctx.strokeStyle = edgeCol(o.hair); ctx.lineWidth = 1.4; ctx.stroke();
  ell(ctx, x - 15, y - 59 + bob, 4.5, 7, o.hair, false);
  ell(ctx, x + 15, y - 59 + bob, 4.5, 7, o.hair, false);
  ctx.globalAlpha = 0.5;
  ell(ctx, x - 8, y - 68 + bob, 6, 3.5, shade(o.hair, 0.3), false);
  ctx.globalAlpha = 1;

// ---------- Audio (Web Audio API) ----------
let audioCtx = null, musicOn = true;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type, vol, when) {
  const ctx = ensureAudio();
  if (!ctx) return;
  const t0 = ctx.currentTime + (when || 0);
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.08, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur);
}

// ---- Konzertsaal-Hall (zwei gekoppelte Delays = Hall-Ersatz) ----
let hall = null;
function getHall(ctx) {
  if (hall) return hall;
  const input = ctx.createGain(); input.gain.value = 1;
  const out = ctx.createGain(); out.gain.value = 1;
  [[0.29, 0.55], [0.43, 0.5]].forEach(([dt, fb]) => {
    const d = ctx.createDelay(1.5); d.delayTime.value = dt;
    const g = ctx.createGain(); g.gain.value = fb;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3200;
    input.connect(d); d.connect(lp); lp.connect(g); g.connect(d); d.connect(out);
  });
  const wet = ctx.createGain(); wet.gain.value = 0.45;
  out.connect(wet); wet.connect(ctx.destination);
  hall = input;
  return hall;
}

// ---- Streicher-Sektion: 3 detunierte Saegezahn + Filter, weicher Bogen ----
function strings(freq, dur, vol, when, cutoff) {

    const o = ctx.createOscillator();
    o.type = "sawtooth"; o.frequency.value = freq; o.detune.value = det;
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.frequency.value = 4.5 + Math.random(); lg.gain.value = freq * 0.004;
    lfo.connect(lg); lg.connect(o.frequency);
    lfo.start(t0); lfo.stop(t0 + dur);
    o.connect(f); o.start(t0); o.stop(t0 + dur + 0.1);
  });
  f.connect(g); g.connect(ctx.destination);
  const h = ctx.createGain(); h.gain.value = 0.5; g.connect(h); h.connect(getHall(ctx));
  g.gain.setValueAtTime(0.0001, t0);

// ---- Holzbläser (Oboe/Flöte): tragende Melodie ----
function winds(freq, dur, vol, when, bright) {

// ---- Hörner: weiches Blech-Pad ----
function horns(freq, dur, vol, when) {
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime + (when || 0);

// ---- Harfe: gezupfte Langsaiten ----
function harp(freq, vol, when) {
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime + (when || 0);

}

// ---- Pauke: Tonsturz + Haut-Rumble ----
function timpani(when, freq, vol) {
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime + (when || 0);
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(freq * 1.5, t0);

}

// ---- Becken: weiche Stabwirbel ----
function cymbal(when, vol) {
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime + (when || 0);
  const b = ctx.createBuffer(1, ctx.sampleRate * 1.4, ctx.sampleRate);
  const d = b.getChannelData(0);

  for (let i = 0; i < d.length; i++) {
    const w = Math.random() * 2 - 1;
    last = (last + w) * 0.5;
    d[i] = last * Math.pow(1 - i / d.length, 1.6);

  const s = ctx.createBufferSource(); s.buffer = b;
  const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 5500;

  s.connect(f); f.connect(g); g.connect(ctx.destination);
  s.start(t0);
}

function startMusic() {
  if (musicTimer || !ensureAudio()) return;
  const ST = SCORE.stepDur;
  const barDur = ST * 4;
  const t0 = ensureAudio().currentTime + 0.1;  // absolute Startzeit des 1. Takts
  musicTimer = setInterval(() => {
    if (!musicOn) return;
    const ctx = ensureAudio(); if (!ctx) return;
    const t = ctx.currentTime;
    // Naechsten Takt planen, sobald seine Zeit naht (1.5 Takte Vorspann)
    if (t > t0 + musicStep * barDur - barDur * 1.5) {
      const bar = musicStep % SCORE.bars;
      const ch = SCORE.chords[bar];
      const barStart = (t0 + musicStep * barDur) - t;  // relative Zeit ab jetzt
      // Streicher: Akkord gehalten den ganzen Takt
      ch.notes.forEach((n, i) => strings(nf(n), barDur * 0.98, 0.028 - i * 0.004, barStart, 1300));
      strings(nf(ch.root + 12), barDur * 0.98, 0.03, barStart, 700);   // Bass-Streicher
      // Hoerner: auf 1 und 3
      ch.horn.forEach(hn => horns(nf(hn), barDur * 0.45, 0.02, barStart));
      if (bar % 2 === 1) ch.horn.forEach(hn => horns(nf(hn), barDur * 0.4, 0.016, barStart + ST * 2));
      // Harfe: gebrochene Arpeggien auf 1, 2, 3, 4
      const arpNotes = [ch.root + 24, ...ch.notes.map(n => n + 12), ch.root + 36];
      arpNotes.forEach((an, i) => harp(nf(an), i === 0 ? 0.04 : 0.028, barStart + i * ST));
      // Pauke: auf 1 (und betont 3 in Takt 2/6)
      timpani(barStart, nf(ch.root), 0.13);
      if (bar % 4 === 3) timpani(barStart + ST * 2, nf(ch.root + 7), 0.1);
      // Beckenrollen bei Teil-Uebergang (Takt 4 und 8)
      if (bar === 3 || bar === 7) cymbal(barStart + ST * 3, 0.02);
      // Oboen-Melodie
      for (const [b, q, n, d] of SCORE.melody) {
        if (b === bar) winds(nf(n), ST * d * 0.94, 0.06, barStart + q * ST, false);
      }
      // Floete ab Takt 4
      for (const [b, q, n, d] of SCORE.flute) {

}

    const r = 3 + pulse * 1.6;
    // weicher Aussen-Schein (radial, folgt der Maus)
    const og = ctx2d.createRadialGradient(mousePos.x, mousePos.y, 0, mousePos.x, mousePos.y, r * 4);
    og.addColorStop(0, "rgba(255,240,200," + (0.28 + pulse * 0.14).toFixed(2) + ")");
    og.addColorStop(0.5, "rgba(255,230,170,0.12)");
    og.addColorStop(1, "rgba(255,230,170,0)");
    ctx2d.fillStyle = og;
    ctx2d.beginPath();
    ctx2d.arc(mousePos.x, mousePos.y, r * 4, 0, Math.PI * 2);
    ctx2d.fill();
    // Kern-Funke
    ctx2d.fillStyle = "rgba(255,248,224," + (0.7 + pulse * 0.3).toFixed(2) + ")";
    ctx2d.beginPath();
    ctx2d.arc(mousePos.x, mousePos.y, r, 0, Math.PI * 2);
    ctx2d.fill();
  }
  requestAnimationFrame(loop);
}

// ---------- Dialogsystem ----------
const dialogBox = document.getElementById("dialog-box");
const dSpeaker = document.getElementById("speaker");
const dText = document.getElementById("text");
const dChoices = document.getElementById("choices");
const dNext = document.getElementById("dialog-next");
let dialogQueue = [], dialogAfter = null;

function showText(speaker, text) {
  dialogBox.hidden = false;
  dSpeaker.textContent = speaker;
  dText.textContent = text;
  dChoices.innerHTML = "";
  dNext.style.display = "block";
}
function showDialog(lines, after) {
  dialogQueue = lines.slice();
  dialogAfter = after || null;
  const [sp, tx] = dialogQueue.shift();
  showText(sp, tx);
}
function showChoice(ch) {
  dialogBox.hidden = false;
  dSpeaker.textContent = "??";
  dText.textContent = ch.prompt;
  dNext.style.display = "none";
  dChoices.innerHTML = "";
  ch.options.forEach(opt => {
    const b = document.createElement("button");
    b.textContent = opt.la;
    b.onclick = () => {
      dChoices.innerHTML = "";
      sound(opt.ok ? "collect" : "error");
      if (opt.ok) {
        if (opt.flag) G.setFlag(opt.flag);
        showDialog(opt.next, () => {
          if (opt.win) {
            G.removeItem("frumentum"); G.removeItem("corona"); G.removeItem("stella");
            G.setFlag("fest_done");
            sound("win");
            showDialog([
              ["Ceres", "Donaria accipio – terra fructum dabit!"],
              ["Feles", "Miau! Festum incipit! Verba " + G.verba.size + " collegisti!"],
              ["Omnes", "FELIX FESTUM CERES! 🌾👑⭐"]
            ]);
          }
        });
      } else {
        showDialog(opt.next, () => {});
      }
    };
    dChoices.appendChild(b);
  });
}
function advanceDialog() {
  if (dChoices.children.length > 0) return;
  if (dialogQueue.length > 0) {
    const [sp, tx] = dialogQueue.shift();
    showText(sp, tx);
  } else {
    dialogBox.hidden = true;
    const fn = dialogAfter; dialogAfter = null;
    if (fn) fn();
  }
}
dialogBox.addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") advanceDialog();
});
dNext.addEventListener("click", advanceDialog);

// ---------- Inventar ----------
const invEl = document.getElementById("inventory"); // kann null sein (UI in bottom-bar)
const bbItems = document.getElementById("bb-items");
const bbVerba = document.getElementById("bb-verba");
const bbVerbaCount = document.getElementById("bb-verba-count");
function renderVerbaChips() {
  if (!bbVerba) return;
  bbVerba.innerHTML = "";
  const words = [...G.verba];
  bbVerbaCount.textContent = words.length;
  if (!words.length) {
    bbVerba.innerHTML = '<span class="bb-empty">nondum verba</span>';
    return;
  }
  for (const la of words) {
    const chip = document.createElement("span");
    chip.className = "bb-chip verba-chip";
    const v = VERBA_MAP[la];
    chip.textContent = la;
    chip.title = v ? (la + " – " + v.de + (v.tipp ? "\n★ " + v.tipp : "")) : la;
    bbVerba.appendChild(chip);
  }
}
function renderInventory() {
  if (invEl) invEl.innerHTML = "";
  if (bbItems) {
    bbItems.innerHTML = "";
    if (!G.inventory.length) {
      bbItems.innerHTML = '<span class="bb-empty">sacca vacua est</span>';
    }
    G.inventory.forEach(item => {
      const info = ITEMS[item];
      const chip = document.createElement("span");
      chip.className = "bb-chip item-chip" + (G.selected === item ? " selected" : "");
      chip.title = info.de;
      // Icon-Canvas statt Text
      const ic = document.createElement("canvas");
      ic.width = 80; ic.height = 80;
      ic.style.width = "34px"; ic.style.height = "34px";
      ic.style.verticalAlign = "middle";
      const ictx = ic.getContext("2d");
      if (ictx) { ictx.scale(2, 2); drawItemIcon(ictx, item); }
      chip.appendChild(ic);
      chip.onclick = () => {
        if (G.selected === item) { G.selected = null; }
        else {
          if (G.selected) tryCombine(G.selected, item);
          else { G.selected = item; sound("click"); }
        }
        renderInventory();
      };
      bbItems.appendChild(chip);
    });
  }
  G.inventory.forEach(item => {
    if (!invEl) return;
    const li = document.createElement("li");
    const info = ITEMS[item];
    li.textContent = (G.selected === item ? "▸ " : "") + info.la;
    if (G.selected === item) li.classList.add("selected");
    li.title = info.de;
    li.onclick = () => {
      if (G.selected === item) { G.selected = null; }
      else {
        if (G.selected) tryCombine(G.selected, item);
        else { G.selected = item; sound("click"); }
      }
      renderInventory();
    };
    invEl.appendChild(li);
  });
}
function tryCombine(a, b) {
  G.selected = null;
  const c = COMBINES.find(c =>
    (c.a === a && c.b === b) || (c.a === b && c.b === a));
  if (c) {
    sound("take");
    showFeles(c.hint || c.la);
  } else {
    sound("error");
    showFeles("Miau! Haec duo non combinantur.");
  }
}

// ---------- Mini-Spiele ----------
// Overlay-Minigames auf der Buehne; nach Erfolg wird das Item vergeben.
let minigame = null; // { kind, onWin }
const MG_W = 300, MG_H = 200;
function startMinigame(kind, onWin) {
  minigame = { kind, t0: performance.now(), state: {}, onWin, done: false };
  sound("click");
}
function minigameActive() { return !!minigame; }
function endMinigame(won) {
  const mg = minigame;
  minigame = null;
  if (won && mg && mg.onWin) mg.onWin();
  else if (!won) sound("error");
}
// Zeichnen + Eingaben (Canvas-Klicks gehen an das Minigame, solange aktiv)
function drawMinigame(ctx, t) {
  if (!minigame) return;
  const mg = minigame;
  const mx = 320 - MG_W / 2, my = 180 - MG_H / 2;
  // Rahmen
  ctx.fillStyle = "rgba(42,36,47,0.94)";
  ctx.beginPath();
  const r = 10;
  ctx.moveTo(mx + r, my); ctx.arcTo(mx + MG_W, my, mx + MG_W, my + MG_H, r);
  ctx.arcTo(mx + MG_W, my + MG_H, mx, my + MG_H, r);
  ctx.arcTo(mx, my + MG_H, mx, my, r); ctx.arcTo(mx, my, mx + MG_W, my, r);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#d4a545"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "#f4ecf4"; ctx.font = "bold 11px Georgia"; ctx.textAlign = "center";
  ctx.fillText(mg.kind === "flowers" ? "Flores carpere! (Klick die bluehenden)" :
    mg.kind === "fishing" ? "Clavis! (Klick, wenn der Ring klein ist)" :
    "Cista! (Merke die Reihenfolge)", 320, my + 16);

  if (mg.kind === "flowers") {
    // 4x4 Blumenfeld, 6 bluehen zufaellig; alle Bluehenden treffen
    if (!mg.state.grid) {
      mg.state.grid = [];
      for (let i = 0; i < 16; i++) mg.state.grid.push({ bloom: hash01(i, 77) > 0.62, hit: false });
    }
    const gx0 = mx + 18, gy0 = my + 26, cs = 66;
    let allHit = true;
    mg.state.grid.forEach((cell, i) => {
      const cx2 = gx0 + (i % 4) * cs + cs / 2, cy2 = gy0 + ((i / 4) | 0) * cs + cs / 2;
      if (cell.bloom && !cell.hit) allHit = false;
      const sway = Math.sin(t / 400 + i) * 2;
      // Stengel
      ctx.strokeStyle = "#4a8a40"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(cx2, cy2 + 14); ctx.quadraticCurveTo(cx2 + sway * 0.5, cy2 + 6, cx2 + sway, cy2); ctx.stroke();
      // Bluete oder Knospe
      if (cell.bloom) {
        const col = cell.hit ? "#7ab468" : "#e87888";
        for (let p2 = 0; p2 < 5; p2++) {
          const ang = p2 / 5 * Math.PI * 2;
          ell(ctx, cx2 + Math.cos(ang) * 6, cy2 + Math.sin(ang) * 6, 4, 4, col, false);
        }
        ell(ctx, cx2, cy2, 3.4, 3.4, cell.hit ? "#c8e0b0" : "#f0c040", false);
      } else {
        ell(ctx, cx2, cy2, 4, 5, "#8aa878", false);
      }
    });
    if (allHit && !mg.done) { mg.done = true; endMinigame(true); }
  } else if (mg.kind === "fishing") {
    // Schluessel am Faden: Ring pulsiert, Klick wenn Ring den Schluessel umrahmt
    if (!mg.state.size) mg.state.size = 1;
    const phase = (t - mg.t0) / 900;
    const ringR = 46 - (Math.abs(Math.sin(phase)) * 40); // zieht zusammen
    const cx2 = mx + MG_W / 2, cy2 = my + MG_H / 2 + 12;
    // Wasser
    ctx.fillStyle = "#9cc8e8";
    ctx.fillRect(mx + 20, cy2 + 24, MG_W - 40, 34);
    // Schluessel
    ell(ctx, cx2, cy2, 9, 9, "#f0d888", false);
    ctx.strokeStyle = "#f0d888"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx2 + 7, cy2 + 6); ctx.lineTo(cx2 + 18, cy2 + 18); ctx.stroke();
    // Ring
    ctx.strokeStyle = ringR < 14 ? "#f8e8a0" : "#e8b060";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx2, cy2, ringR, 0, Math.PI * 2); ctx.stroke();
    mg.state.ringR = ringR;
    mg.state.cx = cx2; mg.state.cy = cy2;
    // Faden
    ctx.strokeStyle = "rgba(230,220,200,0.5)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx2, my + 22); ctx.lineTo(cx2, cy2 - ringR); ctx.stroke();
  } else if (mg.kind === "pattern") {
    // Cista-Schloss: 4 Symbole leuchten nacheinander, dann nachklicken
    const syms = ["#e87888", "#f0c040", "#78c878", "#88a8e0"];
    if (!mg.state.seq) {
      mg.state.seq = [];
      for (let i = 0; i < 4; i++) mg.state.seq.push((hash01(i, 99 + Math.floor(Math.random() * 50)) * 4) | 0);
      mg.state.show = 0; mg.state.input = []; mg.state.lastFlash = 0;
    }
    const seq = mg.state.seq;
    const showPhase = ((t - mg.t0) / 700) | 0;
    const inShow = showPhase < seq.length;
    // 4 Knopfe im Quadrat
    for (let i = 0; i < 4; i++) {
      const bx2 = mx + 70 + (i % 2) * 120, by2 = my + 48 + ((i / 2) | 0) * 64;
      const flash = inShow && showPhase === i ? 0.9 : (mg.state.input && mg.state.input.length && mg.state.input[mg.state.input.length - 1] === i ? 0.5 : 0.15);
      ctx.globalAlpha = 0.3 + flash;
      rr(ctx, bx2, by2, 40, 40, syms[i], true, 8);
      ctx.globalAlpha = 1;
      // Hitbox merken
      if (!mg.state.buttons) mg.state.buttons = [];
      mg.state.buttons[i] = { x: bx2, y: by2, w: 40, h: 40 };
    }
    mg.state.inShow = inShow;
    if (!inShow && mg.state.input && mg.state.input.length >= seq.length && !mg.done) {
      const won = mg.state.input.every((v, i2) => v === seq[i2]);
      mg.done = true;
      endMinigame(won);
    }
  }
}
// Minigame-Klickverarbeitung (in stageCoords-Aufloesung)
function minigameClick(x, y) {
  if (!minigame) return false;
  const mg = minigame;
  const mx = 320 - MG_W / 2, my = 180 - MG_H / 2;
  if (mg.kind === "flowers") {
    const gx0 = mx + 18, gy0 = my + 26, cs = 66;
    const col = ((x - gx0) / cs) | 0, row = ((y - gy0) / cs) | 0;
    if (col >= 0 && col < 4 && row >= 0 && row < 4) {
      const cell = mg.state.grid[row * 4 + col];
      if (cell && cell.bloom) { cell.hit = true; sound("collect"); return true; }
      // Fehlklick auf Knospe: kurzer Fehler, kein Abbruch
      sound("error");
      return true;
    }
  } else if (mg.kind === "fishing") {
    if (mg.state.ringR < 16) { endMinigame(true); }
    else { endMinigame(false); }
    return true;
  } else if (mg.kind === "pattern") {
    if (mg.state.inShow) return true; // erst nach der Vorgabe klicken
    for (let i = 0; i < 4; i++) {
      const b = mg.state.buttons[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        mg.state.input.push(i);
        sound("click");
        return true;
      }
    }
  }
  return false;
}

// ---------- Hotspot-Handling ----------
function applyResult(res) {
  if (!res) return;
  if (res.give) { G.addItem(res.give); }
  if (res.give2) { G.addItem(res.give2); }
  if (res.take) { G.removeItem(res.take); }
  renderInventory();
  if (res.verbum) G.verbaAdd(res.verbum);
  if (res.type === "text") { showText(G.char === "lucius" ? "Lucius" : "Aurelia", res.la); sound("click"); }
  if (res.type === "take") {
    G.addItem(res.item); renderInventory(); sound("take");
    showText("Feles", res.la || (ITEMS[res.item].la + " in saccum mitto!"));
  }
  if (res.type === "dialog") {
    const lines = res.lines.slice();
    if (res.give || res.give2) {
      const item = res.give || res.give2;
      lines.push(["Feles", ITEMS[item].la + " in saccā est!"]);
    }
    showDialog(lines, res.choice ? () => showChoice(res.choice) : null);
  }
  if (res.type === "feles") showFeles(res.text);
  if (res.type === "choice") showChoice(res.choice);
  if (res.type === "goto") { startScroll(res.target); sound("click"); }
}
function updateSceneName() {
  document.getElementById("scene-name").textContent = "» " + SCENES[G.scene].name;
}

function spotAt(x, y, spots) {
  for (const sp of spots) {
    if (x >= sp.x && x <= sp.x + sp.w && y >= sp.y && y <= sp.y + sp.h) return sp;
  }
  return null;
}
function stageCoords(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width * 640,
    y: (e.clientY - r.top) / r.height * 360
  };
}
canvas.addEventListener("mousemove", e => {
  const { x, y } = stageCoords(e);
  const sc = SCENES[G.scene];
  mousePos = { x, y };
  hoverSpot = spotAt(x, y, sc.hotspots) || spotAt(x, y, sc.exits);
  canvas.style.cursor = hoverSpot ? "pointer" : "default";
});
canvas.addEventListener("click", e => {
  ensureAudio();
  if (!dialogBox.hidden) return;
  if (scrollState) return; // waehrend der Schriftrollen-Animation keine Szenenwechsel
  const { x, y } = stageCoords(e);
  if (minigameClick(x, y)) return;
  const sc = SCENES[G.scene];
  const exit = spotAt(x, y, sc.exits);
  if (exit) {
    sound("click");
    startScroll(exit.target);
    return;
  }
  const sp = spotAt(x, y, sc.hotspots);
  if (sp) {
    sound("click");
    G.verbaAdd(sp.la);
    const res = sp.onUse ? sp.onUse(sc, G) : null;
    if (!res && sp.target) {
      startScroll(sp.target); return;
    }
    applyResult(res);
  }
});

      ["Feles", "Pecuniam a patre accipe, deinde frumentum eme! Verba collige!"]
    ]);
  });
});
